<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Ngoại tuyến - LearnNN</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #1e293b;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            padding: 2.25rem 1.75rem;
            max-width: 24rem;
            width: 100%;
            text-align: center;
        }
        .icon-wrapper {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: #fee2e2;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-wrapper svg {
            width: 2.25rem;
            height: 2.25rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 1.75rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-retry:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .status-badge {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-5.657m0 0L3 3m2.828 2.828a9 9 0 015.657-2.828m0 0a9 9 0 017.071 2.828M8.464 15.536a5 5 0 01-1.414-3.536m0 0a5 5 0 011.414-3.536m0 0L3 3" />
            </svg>
        </div>
        <h1>Mất kết nối mạng</h1>
        <p>Không có kết nối Internet. Vui lòng kiểm tra lại mạng Wi-Fi hoặc dữ liệu di động (4G/5G). Ứng dụng sẽ tự động tải lại khi phát hiện có mạng.</p>
        <button type="button" class="btn-retry" onclick="window.location.reload()">
            Thử kết nối lại
        </button>
        <div class="status-badge">Tự động kết nối lại khi có mạng</div>
    </div>
    <script>
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
